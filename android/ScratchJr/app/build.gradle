plugins {
    id 'com.android.application'
}

android {
    namespace 'org.scratchjr.android'
    compileSdkVersion 35
    buildToolsVersion "36.1.0"

    defaultConfig {
        applicationId "org.scratchjr.android"
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    flavorDimensions = ['scratchjrversion']
    productFlavors {
        free {
            dimension = 'scratchjrversion'
            applicationId "org.scratchjr.androidfree"
            minSdkVersion 21
            targetSdkVersion 29
            versionCode 22
            versionName "1.2.11"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    def camerax_version = "1.3.4"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"

    // Align legacy kotlin-stdlib-jdk7/jdk8 to the same Kotlin version as kotlin-stdlib.
    // Since Kotlin 1.8, those modules are empty redirects, so this eliminates the
    // duplicate-class error caused by transitives that still request 1.6.21.
    constraints {
        implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

def srcDir = 'src'
def commonHome = '../../..'
def html5Assets = 'src/main/assets/HTML5'
def webpackBundleSrc = "${commonHome}/src/build/bundles"

task switchToFree(type: Copy) {
    def buildType = 'free'
    from "${commonHome}/editions/${buildType}/src"
    into html5Assets
    // Exclude the symlink placeholder files; the real bundle is copied separately below.
    // On Windows clones without symlink support these would otherwise be 40-byte text stubs.
    exclude 'app.bundle.js', 'app.bundle.js.map'
}

task copyWebpackBundle(type: Copy) {
    from webpackBundleSrc
    include 'app.bundle.js', 'app.bundle.js.map'
    into html5Assets
}

task generateWebpackBundle(type: Exec) {
    workingDir "${commonHome}"
    // webpack 4 + Node 17+ requires the legacy OpenSSL provider for the MD4 hash it uses internally.
    environment 'NODE_OPTIONS', '--openssl-legacy-provider'
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        commandLine 'cmd', '/c', 'npx', 'webpack', '--mode=production'
    } else {
        commandLine 'npx', 'webpack', '--mode=production'
    }
}

class GenerateScratchJrPNGsTask extends DefaultTask {
    @Internal File commonHome = project.file("../../..")
    @Internal File binDir = project.file("${commonHome}/bin")
    @Internal File generatedAssets = project.file("src/main/assets")
    @Internal File generatedHtml5Assets = project.file("${generatedAssets}/HTML5")

    @InputDirectory File svgLibrary = project.file("${generatedHtml5Assets}/svglibrary")
    @OutputDirectory File pngLibrary = project.file("${generatedHtml5Assets}/pnglibrary")

    @TaskAction
    def go() {
        pngLibrary.mkdirs()
        def venvPython = project.file("${commonHome}/.venv/Scripts/python.exe")
        def pythonExe = venvPython.exists() ? venvPython.absolutePath : 'python'
        project.exec {
            commandLine pythonExe, "${binDir}/convert-svg-to-png.py",
                '-i', "${svgLibrary}",
                '-o', "${pngLibrary}"
        }
    }
}

class CleanScratchJrResourcesTask extends DefaultTask {
    @Internal File generatedAssets = project.file('src/main/assets')

    @TaskAction
    def go() {
        generatedAssets.deleteDir()
    }
}

task generateScratchJrPNGs(type: GenerateScratchJrPNGsTask)
task cleanScratchJrResources(type: CleanScratchJrResourcesTask)

afterEvaluate {
    preBuild.dependsOn generateWebpackBundle

    // These custom tasks write into src/main/assets/HTML5, which is the input of
    // mergeFree{Debug,Release}Assets. AGP 8 fails the build if the merge task reads
    // an output that isn't declared as its dependency, so hook them in explicitly.
    mergeFreeReleaseAssets.dependsOn switchToFree, copyWebpackBundle, generateScratchJrPNGs
    mergeFreeDebugAssets.dependsOn switchToFree, copyWebpackBundle, generateScratchJrPNGs

    copyWebpackBundle.mustRunAfter switchToFree
    copyWebpackBundle.dependsOn generateWebpackBundle
    generateScratchJrPNGs.mustRunAfter switchToFree
    generateScratchJrPNGs.mustRunAfter copyWebpackBundle
}

clean.dependsOn('cleanScratchJrResources')
